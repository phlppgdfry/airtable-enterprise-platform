name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check (Core CLI & Custom Extension)
        run: npm run typecheck

      - name: Run Automated Test Suite
        run: npm test

      - name: Test CLI Commands & Dry-Runs
        run: |
          npm run seed -- --dry-run
          npm run audit
          npm run schema:export
          npm run data:lint
          npm run backup
          LATEST_BACKUP=$(ls -td backups/snapshot-* | head -1)
          npm run restore:dry -- -s "$LATEST_BACKUP"
